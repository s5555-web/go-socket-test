map $http_upgrade $signal_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 801 ssl;
    listen [::]:801 ssl;
    server_name 103.96.149.248;
	# Nginx uses status 497 when plain HTTP reaches an SSL-only port.
	error_page 497 =307 https://$host:$server_port$request_uri;

    ssl_certificate /etc/letsencrypt/live/signal-web-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signal-web-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:1801;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 802 ssl;
    listen [::]:802 ssl;
    server_name 103.96.149.248;
	error_page 497 =307 https://$host:$server_port$request_uri;

    ssl_certificate /etc/letsencrypt/live/signal-web-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signal-web-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://103.96.149.248:802; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /downloads/SignalWeb-Windows-x64-v1.0.0.zip {
        alias /opt/signal-web/downloads/SignalWeb-Windows-x64-v1.0.0.zip;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="SignalWeb-Windows-x64-v1.0.0.zip"';
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:1802;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $signal_connection_upgrade;
    }
}
