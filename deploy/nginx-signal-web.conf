map $http_upgrade $signal_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name msg.trip-vn.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://msg.trip-vn.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name msg.trip-vn.com;

    ssl_certificate /etc/letsencrypt/live/msg.trip-vn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/msg.trip-vn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://msg.trip-vn.com; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /downloads/SignalWeb-Android-v1.0.0.apk {
        alias /opt/signal-web/downloads/SignalWeb-Android-v1.0.0.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="SignalWeb-Android-v1.0.0.apk"';
        add_header Cache-Control "public, max-age=3600";
    }

    location = /downloads/SignalWeb-iOS.mobileconfig {
        alias /opt/signal-web/downloads/SignalWeb-iOS.mobileconfig;
        default_type application/x-apple-aspen-config;
        add_header Content-Disposition 'attachment; filename="SignalWeb-iOS.mobileconfig"';
        add_header Cache-Control "public, max-age=3600";
    }

    location = /.well-known/assetlinks.json {
        alias /opt/signal-web/web/client/.well-known/assetlinks.json;
        default_type application/json;
    }

    location /downloads/ {
        alias /opt/signal-web/downloads/;
        autoindex on;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://127.0.0.1:1802;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $signal_connection_upgrade;
    }
}

server {
    listen 801 ssl;
    listen [::]:801 ssl;
    server_name msg.trip-vn.com;
	error_page 497 =307 https://msg.trip-vn.com:801$request_uri;

    ssl_certificate /etc/letsencrypt/live/msg.trip-vn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/msg.trip-vn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:1801;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Keep the previous IP:802 endpoint available for already-installed Windows clients.
server {
    listen 802 ssl;
    listen [::]:802 ssl;
    server_name 103.96.149.248;
    error_page 497 =307 https://$host:$server_port$request_uri;

    ssl_certificate /etc/letsencrypt/live/signal-web-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signal-web-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://103.96.149.248:802; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location /downloads/ {
        alias /opt/signal-web/downloads/;
    }

    location / {
        proxy_pass http://127.0.0.1:1802;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $signal_connection_upgrade;
    }
}
