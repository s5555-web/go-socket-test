<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2c6bed"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Signal"><title>Signal Web</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/icon.svg"><link rel="apple-touch-icon" href="/assets/icon.svg"><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/layout.css"><link rel="stylesheet" href="/assets/mobile.css"><link rel="stylesheet" href="/assets/chat-extras.css"></head><body>
<div id="auth" class="auth"><form id="authForm" class="card"><div class="logo">S</div><h1>Signal Web</h1><p>安静、专注的即时通讯</p><input id="display" placeholder="昵称（注册时填写）"><input id="username" placeholder="用户名" required><input id="password" type="password" placeholder="密码" required><button>登录</button><button type="button" class="ghost" id="toggle">没有账号？注册</button><div class="mobileDownloads"><a href="/downloads/SignalWeb-Android-v1.0.0.apk">Android APK</a><a href="/downloads/SignalWeb-iOS.mobileconfig">iPhone 安装</a></div><div id="authErr" class="error"></div></form></div>
<main id="app" hidden><aside><header><div><b id="myName"></b><small> Signal Web</small></div><div class="headerActions"><button class="icon" id="notifications" title="开启消息通知">♢</button><button class="icon" id="logout" title="退出">↪</button></div></header><div class="search"><input id="search" placeholder="搜索联系人"><button id="newGroup">＋</button></div><div id="contacts" class="contacts"></div><div id="chats"></div></aside><section class="conversation"><div id="empty" class="empty"><div class="shield">✓</div><h2>选择一段对话</h2><p>消息内容与图片均在设备端完成端到端加密。</p></div><div id="room" hidden><header><button class="mobileBack" id="mobileBack" title="返回会话列表">‹</button><div class="avatar" id="roomAvatar"></div><div><b id="roomName"></b><small>实时消息</small></div></header><div id="messages"></div><form id="composer"><div id="imageDraft" hidden><img id="imageDraftPreview" alt="待发送图片"><span id="imageDraftName"></span><button type="button" id="removeImage" title="移除图片">×</button></div><button type="button" class="composerTool" id="emojiToggle" title="表情">☺</button><button type="button" class="composerTool" id="imageButton" title="发送图片">＋</button><textarea id="message" placeholder="发送消息" rows="1"></textarea><button id="sendMessage" title="发送">➤</button><input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden><div id="emojiPanel" hidden></div></form></div></section></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div><div id="imageViewer" hidden><button id="closeImageViewer" title="关闭">×</button><img id="imageViewerContent" alt="图片预览"><div id="imageViewerName"></div></div><dialog id="groupDialog"><form method="dialog" class="modal"><h2>新建群聊</h2><input id="groupName" placeholder="群聊名称"><div id="groupUsers"></div><div class="actions"><button value="cancel" class="ghost">取消</button><button type="button" id="createGroup">创建</button></div></form></dialog><script src="/assets/crypto.js"></script><script src="/assets/app.js"></script></body></html>
