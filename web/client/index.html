<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Web</title><link rel="stylesheet" href="/assets/app.css"></head><body>
<div id="auth" class="auth"><form id="authForm" class="card"><div class="logo">S</div><h1>Signal Web</h1><p>安静、专注的即时通讯</p><input id="display" placeholder="昵称（注册时填写）"><input id="username" placeholder="用户名" required><input id="password" type="password" placeholder="密码" required><button>登录</button><button type="button" class="ghost" id="toggle">没有账号？注册</button><div id="authErr" class="error"></div></form></div>
<main id="app" hidden><aside><header><div><b id="myName"></b><small> Signal Web</small></div><button class="icon" id="logout" title="退出">↪</button></header><div class="search"><input id="search" placeholder="搜索联系人"><button id="newGroup">＋</button></div><div id="contacts" class="contacts"></div><div id="chats"></div></aside><section class="conversation"><div id="empty" class="empty"><div class="shield">✓</div><h2>选择一段对话</h2><p>消息在传输中受到保护。此版本尚未实现 Signal 协议的端到端加密。</p></div><div id="room" hidden><header><div class="avatar" id="roomAvatar"></div><div><b id="roomName"></b><small>实时消息</small></div></header><div id="messages"></div><form id="composer"><textarea id="message" placeholder="发送消息" rows="1"></textarea><button>➤</button></form></div></section></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="groupDialog"><form method="dialog" class="modal"><h2>新建群聊</h2><input id="groupName" placeholder="群聊名称"><div id="groupUsers"></div><div class="actions"><button value="cancel" class="ghost">取消</button><button type="button" id="createGroup">创建</button></div></form></dialog><script src="/assets/crypto.js"></script><script src="/assets/app.js"></script></body></html>
