<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Web 管理后台</title>
  <style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f6fa;color:#20232a}header{background:#17213a;color:#fff;padding:20px 5%;display:flex;justify-content:space-between}.wrap{max-width:1180px;margin:32px auto;padding:0 20px}.login{max-width:380px;margin:15vh auto;background:#fff;padding:36px;border-radius:18px;box-shadow:0 15px 40px #0001}input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font:inherit}textarea{min-height:76px;resize:vertical}button{border:0;border-radius:8px;background:#2c6bed;color:#fff;padding:10px 15px;cursor:pointer}.login button{width:100%;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.stat,section{background:#fff;border-radius:14px;padding:22px;box-shadow:0 4px 18px #0000000a}.stat b{display:block;font-size:34px;color:#2c6bed}.stat span,.hint{color:#777}section{margin-top:24px;overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid #eee;vertical-align:top}.danger{background:#fff0f0;color:#c22}.secondary{background:#eef3ff;color:#2c6bed}.support-on{background:#e8f8ee;color:#178044}.site-form{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}.site-form textarea,.site-form .wide{grid-column:1/-1}.site-card{border:1px solid #e5e8ef;border-radius:12px;padding:16px;margin-top:14px}.site-card h3{margin:0 0 8px}.site-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.snippet{background:#111827;color:#dce7ff;padding:12px;border-radius:9px;white-space:pre-wrap;word-break:break-all;font:12px ui-monospace,monospace}.site-actions{display:flex;gap:8px;margin-top:10px}@media(max-width:700px){.stats,.site-form,.site-meta{grid-template-columns:1fr}.site-form textarea,.site-form .wide{grid-column:auto}table{font-size:12px}}</style>
</head>
<body>
  <div id="login" class="login"><h1>管理后台</h1><p>使用管理员账号登录</p><form id="form"><input id="u" placeholder="用户名"><input id="p" type="password" placeholder="密码"><button>登录</button></form><p id="err" style="color:#c22"></p></div>
  <div id="app" hidden><header><b>Signal Web · 管理后台</b><button id="out">退出</button></header><div class="wrap">
    <div class="stats"><div class="stat"><b id="users">0</b><span>用户</span></div><div class="stat"><b id="convs">0</b><span>私聊/群聊会话</span></div><div class="stat"><b id="msgs">0</b><span>旧消息表记录</span></div></div>
    <section><h2>客服插件站点</h2><p class="hint">授权域名填写完整来源（例如 https://www.example.com）；多个来源用逗号分隔。测试时可填写 *。</p><form id="siteForm" class="site-form"><input id="siteName" placeholder="站点名称" required><input id="siteOrigin" placeholder="https://www.example.com" required><textarea id="siteWelcome" class="wide" placeholder="欢迎语">您好，请问有什么可以帮您？</textarea><button class="wide">创建客服插件</button></form><div id="sites"></div></section>
    <section><h2>用户与客服账号</h2><p class="hint">启用客服后，该账号重新登录现有 Chat，即会看到“客服”入口。</p><table><thead><tr><th>ID</th><th>用户名</th><th>昵称</th><th>个人简介</th><th>角色</th><th>注册时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section>
  </div></div>
  <script>
    const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML},attr=s=>esc(s).replaceAll('"','&quot;');let token=localStorage.adminToken||'';
    const api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};const r=await fetch('/api'+path,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'请求失败');return j};
    document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{const x=await api('/login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});if(!x.is_admin)throw Error('该账号不是管理员');token=x.token;localStorage.adminToken=token;start()}catch(e){err.textContent=e.message}};
    function snippet(site){return `<script src="https://msg.trip-vn.com/assets/support-widget.js" data-site-key="${site.site_key}" data-title="在线客服" async><\/script>`}
    function renderSites(list){sites.innerHTML=list.length?list.map(site=>`<div class="site-card" data-site-id="${site.id}"><h3>${esc(site.name)} ${site.enabled?'':'（已停用）'}</h3><div class="site-meta"><label>授权域名<input data-field="allowed_origin" value="${attr(site.allowed_origin)}"></label><label>欢迎语<input data-field="welcome_message" value="${attr(site.welcome_message)}"></label></div><input data-field="name" value="${attr(site.name)}"><div class="snippet">${esc(snippet(site))}</div><div class="site-actions"><button onclick="saveSite(${site.id},${site.enabled})">保存配置</button><button class="secondary" onclick="copySnippet(${site.id})">复制嵌入代码</button><button class="${site.enabled?'danger':'support-on'}" onclick="toggleSite(${site.id},${!site.enabled})">${site.enabled?'停用':'启用'}</button></div></div>`).join(''):'<p class="hint">尚未创建客服插件站点。</p>';window.siteList=list}
    async function start(){try{const [s,us,siteList]=await Promise.all([api('/stats'),api('/users'),api('/support-sites')]);login.hidden=true;app.hidden=false;users.textContent=s.users;convs.textContent=s.conversations;msgs.textContent=s.messages;rows.innerHTML=us.map(x=>`<tr><td>${x.id}</td><td>${esc(x.username)}</td><td>${esc(x.display_name)}</td><td>${esc(x.about)}</td><td>${x.is_admin?'管理员 ':''}${x.is_support?'客服':'普通用户'}</td><td>${new Date(x.created_at).toLocaleString()}</td><td><button class="${x.is_support?'danger':'support-on'}" onclick="setSupport(${x.id},${!x.is_support})">${x.is_support?'取消客服':'设为客服'}</button> ${x.is_admin?'':`<button class="danger" onclick="del(${x.id})">删除</button>`}</td></tr>`).join('');renderSites(siteList)}catch(e){localStorage.removeItem('adminToken');login.hidden=false;app.hidden=true;err.textContent=e.message}}
    siteForm.onsubmit=async e=>{e.preventDefault();try{await api('/support-sites',{method:'POST',body:JSON.stringify({name:siteName.value,allowed_origin:siteOrigin.value,welcome_message:siteWelcome.value})});siteForm.reset();siteWelcome.value='您好，请问有什么可以帮您？';start()}catch(e){alert(e.message)}};
    async function setSupport(id,value){await api(`/users/${id}/support`,{method:'PUT',body:JSON.stringify({is_support:value})});start()}
    function siteData(id,enabled){const card=document.querySelector(`[data-site-id="${id}"]`);return{name:card.querySelector('[data-field="name"]').value,allowed_origin:card.querySelector('[data-field="allowed_origin"]').value,welcome_message:card.querySelector('[data-field="welcome_message"]').value,enabled}}
    async function saveSite(id,enabled){try{await api(`/support-sites/${id}`,{method:'PUT',body:JSON.stringify(siteData(id,enabled))});start()}catch(e){alert(e.message)}}async function toggleSite(id,enabled){await api(`/support-sites/${id}`,{method:'PUT',body:JSON.stringify(siteData(id,enabled))});start()}
    async function copySnippet(id){const site=window.siteList.find(x=>x.id===id);await navigator.clipboard.writeText(snippet(site));alert('嵌入代码已复制')}async function del(id){if(confirm('确定删除该用户？')){await api('/users/'+id,{method:'DELETE'});start()}}
    out.onclick=()=>{localStorage.removeItem('adminToken');location.reload()};if(token)start();
  </script>
</body></html>
