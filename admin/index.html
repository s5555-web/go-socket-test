<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Web 管理后台</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f6fa;color:#20232a}header{background:#17213a;color:#fff;padding:20px 5%;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:32px auto;padding:0 20px}.login{max-width:380px;margin:15vh auto;background:#fff;padding:36px;border-radius:18px;box-shadow:0 15px 40px #0001}input{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:9px}button{border:0;border-radius:8px;background:#2c6bed;color:#fff;padding:11px 16px;cursor:pointer}.login button{width:100%;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.stat,section{background:#fff;border-radius:14px;padding:22px;box-shadow:0 4px 18px #0000000a}.stat b{display:block;font-size:34px;color:#2c6bed}.stat span{color:#777}section{margin-top:24px;overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid #eee}.danger{background:#fff0f0;color:#c22}@media(max-width:600px){.stats{grid-template-columns:1fr}table{font-size:12px}}</style></head><body><div id="login" class="login"><h1>管理后台</h1><p>使用管理员账号登录</p><form id="form"><input id="u" placeholder="用户名"><input id="p" type="password" placeholder="密码"><button>登录</button></form><p id="err" style="color:#c22"></p></div><div id="app" hidden><header><b>Signal Web · 管理后台</b><button id="out">退出</button></header><div class="wrap"><div class="stats"><div class="stat"><b id="users">0</b><span>用户</span></div><div class="stat"><b id="convs">0</b><span>会话</span></div><div class="stat"><b id="msgs">0</b><span>消息</span></div></div><section><h2>用户管理</h2><table><thead><tr><th>ID</th><th>用户名</th><th>昵称</th><th>个人简介</th><th>角色</th><th>注册时间</th><th></th></tr></thead><tbody id="rows"></tbody></table></section></div></div><script>const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML};let token=localStorage.adminToken||'';const api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};let r=await fetch('/api'+path,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'请求失败');return j};document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{let x=await api('/login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});if(!x.is_admin)throw Error('该账号不是管理员');token=x.token;localStorage.adminToken=token;start()}catch(e){err.textContent=e.message}};async function start(){try{let [s,us]=await Promise.all([api('/stats'),api('/users')]);login.hidden=true;app.hidden=false;users.textContent=s.users;convs.textContent=s.conversations;msgs.textContent=s.messages;rows.innerHTML=us.map(x=>`<tr><td>${x.id}</td><td>${esc(x.username)}</td><td>${esc(x.display_name)}</td><td>${esc(x.about)}</td><td>${x.is_admin?'管理员':'用户'}</td><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.is_admin?'':`<button class="danger" onclick="del(${x.id})">删除</button>`}</td></tr>`).join('')}catch(e){localStorage.removeItem('adminToken')}}async function del(id){if(confirm('确定删除该用户？')){await api('/users/'+id,{method:'DELETE'});start()}}out.onclick=()=>{localStorage.removeItem('adminToken');location.reload()};if(token)start();</script></body></html>
